name: 📝 Documentation
description: Rédiger ou modifier de la documentation (game design, lore, règles, specs)
title: "[Docs] "
labels: ["documentation"]
body:
  - type: dropdown
    id: domaine
    attributes:
      label: Domaine
      options:
        - Game design (règles du jeu, équilibrage)
        - Lore / univers
        - Spécifications techniques
        - Organisation du projet
        - Autre
    validations:
      required: true
  - type: textarea
    id: contenu
    attributes:
      label: Contenu à rédiger
      description: Qu'est-ce qui doit être documenté ?
      placeholder: Décrire le système de classes de personnages...
    validations:
      required: true
  - type: textarea
    id: criteres
    attributes:
      label: Critères d'acceptation
      placeholder: |
        - [ ] Le document couvre ...
        - [ ] Relu par l'autre membre de l'équipe
    validations:
      required: false
